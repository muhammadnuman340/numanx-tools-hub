name: CI Quality Gate & Pre-Build Sanity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Audit, Unit Tests & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Repository & SEO Audit
        run: node scripts/audit-site.mjs

      - name: Execute Vitest Test Suite
        run: npm test

      - name: Build Static Astro Site
        run: npm run build

      - name: Ping IndexNow (Production Push Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/ping-indexnow.mjs
        continue-on-error: true
