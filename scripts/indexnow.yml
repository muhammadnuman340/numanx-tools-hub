name: NumanX Audit, Test & IndexNow Broadcast

on:
  push:
    branches: [master, main]

jobs:
  verify-and-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run NumanX Pre-Build Site Audit
        run: npm run audit

      - name: Run Automated Vitest Suite
        run: npm test

      - name: Build Static Astro Production Bundle
        run: npm run build

      - name: Broadcast All Sitemap URLs to IndexNow (Bing, Copilot, Perplexity, OAI)
        run: npm run submit:indexnow
